<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#0f0f0f"/>

  <!-- Patrón tejido 5x5 — alternando oscuro/verde como trama y urdimbre -->
  <rect x="6"  y="6"  width="10" height="10" rx="2" fill="#3ecf8e" opacity="0.95"/>
  <rect x="20" y="6"  width="10" height="10" rx="2" fill="#1a4731" opacity="0.7"/>
  <rect x="34" y="6"  width="10" height="10" rx="2" fill="#3ecf8e" opacity="0.95"/>
  <rect x="48" y="6"  width="10" height="10" rx="2" fill="#1a4731" opacity="0.7"/>

  <rect x="6"  y="20" width="10" height="10" rx="2" fill="#1a4731" opacity="0.7"/>
  <rect x="20" y="20" width="10" height="10" rx="2" fill="#3ecf8e" opacity="0.95"/>
  <rect x="34" y="20" width="10" height="10" rx="2" fill="#1a4731" opacity="0.7"/>
  <rect x="48" y="20" width="10" height="10" rx="2" fill="#3ecf8e" opacity="0.95"/>

  <rect x="6"  y="34" width="10" height="10" rx="2" fill="#3ecf8e" opacity="0.95"/>
  <rect x="20" y="34" width="10" height="10" rx="2" fill="#1a4731" opacity="0.7"/>
  <rect x="34" y="34" width="10" height="10" rx="2" fill="#3ecf8e" opacity="0.95"/>
  <rect x="48" y="34" width="10" height="10" rx="2" fill="#1a4731" opacity="0.7"/>

  <rect x="6"  y="48" width="10" height="10" rx="2" fill="#1a4731" opacity="0.7"/>
  <rect x="20" y="48" width="10" height="10" rx="2" fill="#3ecf8e" opacity="0.95"/>
  <rect x="34" y="48" width="10" height="10" rx="2" fill="#1a4731" opacity="0.7"/>
  <rect x="48" y="48" width="10" height="10" rx="2" fill="#3ecf8e" opacity="0.95"/>
</svg>

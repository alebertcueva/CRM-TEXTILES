<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fondo oscuro redondeado -->
  <rect width="64" height="64" rx="12" fill="#0f0f0f"/>

  <!-- Patrón tejido (weave) en la mitad superior -->
  <!-- Hileras horizontales y verticales simulando trama -->
  <rect x="8"  y="8"  width="6" height="6" rx="1" fill="#3ecf8e" opacity="0.9"/>
  <rect x="18" y="8"  width="6" height="6" rx="1" fill="#3ecf8e" opacity="0.4"/>
  <rect x="28" y="8"  width="6" height="6" rx="1" fill="#3ecf8e" opacity="0.9"/>
  <rect x="38" y="8"  width="6" height="6" rx="1" fill="#3ecf8e" opacity="0.4"/>
  <rect x="48" y="8"  width="6" height="6" rx="1" fill="#3ecf8e" opacity="0.9"/>

  <rect x="8"  y="18" width="6" height="6" rx="1" fill="#3ecf8e" opacity="0.4"/>
  <rect x="18" y="18" width="6" height="6" rx="1" fill="#3ecf8e" opacity="0.9"/>
  <rect x="28" y="18" width="6" height="6" rx="1" fill="#3ecf8e" opacity="0.4"/>
  <rect x="38" y="18" width="6" height="6" rx="1" fill="#3ecf8e" opacity="0.9"/>
  <rect x="48" y="18" width="6" height="6" rx="1" fill="#3ecf8e" opacity="0.4"/>

  <!-- Línea separadora -->
  <line x1="8" y1="31" x2="56" y2="31" stroke="#3ecf8e" stroke-width="1" opacity="0.3"/>

  <!-- Texto A.Bert -->
  <text x="32" y="50"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-weight="800"
    font-size="17"
    letter-spacing="0.5"
    fill="#3ecf8e">A.Bert</text>
</svg>
